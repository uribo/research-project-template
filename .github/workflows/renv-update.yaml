# Weekly renv lockfile update.
#
# This workflow is inert until the downstream project adopts renv.lock. When a
# lockfile exists, it restores the pinned environment, runs renv::update(), and
# opens or refreshes a PR only if renv.lock changed.
name: renv-update

on:
  # Fires daily at 19:17 UTC (04:17 JST); the gate job below runs the update on
  # only one JST weekday per repository (derived from the repo name) so that
  # projects created from this template do not all open PRs on the same day.
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renv-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Spread scheduled runs across the week: each repository is assigned one JST
  # weekday from a hash of its name, so multiple projects created from this
  # template do not fire simultaneously. Weekday is evaluated in JST to match the
  # human review cadence (the 19:17 UTC trigger is 04:17 JST the next day).
  # Manual dispatch always proceeds.
  gate:
    runs-on: ubuntu-latest
    # Hash evaluation only; normally finishes in well under a minute. See the
    # note on the update job below for why the 6-hour default is not left in
    # place.
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether today is this repo's slot
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hash=$(printf '%s' "$GITHUB_REPOSITORY" | cksum | cut -d' ' -f1)
          target_dow=$((hash % 7))
          today_dow=$(TZ=Asia/Tokyo date +%w)
          if [ "$today_dow" -eq "$target_dow" ]; then
            echo "Today (JST dow=$today_dow) is this repo's slot; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Today (JST dow=$today_dow) != slot ($target_dow); skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # The default job timeout is 6 hours. r-lib/actions/setup-r@v2 stalled on
    # 2026-08-19 and held runners until that cap, which alone consumed 360
    # runner-minutes per affected repository. A normal update run takes a few
    # minutes, so bound it: a hung run should fail fast and be re-runnable
    # rather than read as "still running".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for renv.lock
        id: lockfile
        run: |
          if [ -f renv.lock ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "No renv.lock found; skipping package update."
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.lockfile.outputs.has_lockfile == 'true'
        with:
          # "renv" resolves to the R version recorded in renv.lock, so restore
          # and update run under the same R the project pins. Safe here: this
          # step only runs when the lockfile exists (guard above).
          r-version: "renv"
          use-public-rspm: true

      # utils::install.packages(), not install.packages(): this job only runs
      # when renv.lock exists, so the project .Rprofile has activated renv,
      # which masks install.packages() with a shim attached as "renv:shims" on
      # the search path. A bare call would be routed through renv, which
      # ignores the explicit pak repo below and asks pak to install pak itself,
      # failing on a source build. The namespace-qualified call bypasses the
      # shim and still installs into renv's project library. Full note in
      # R-check.yaml.
      - name: Install renv tooling
        if: steps.lockfile.outputs.has_lockfile == 'true'
        run: |
          RENV_LOCK_VERSION=$(jq -r '.Packages.renv.Version' renv.lock)
          export RENV_LOCK_VERSION
          Rscript - <<'RSCRIPT'
          utils::install.packages("pak", repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.version$os, R.version$arch
          ))
          # Install the renv version the lockfile pins, not CRAN's latest. The
          # later steps load renv from the project library, so a bare "renv"
          # here ran restore, update and snapshot under a newer renv than the
          # project uses (1.3.1 against a pinned 1.2.4 in 2026-10).
          pak::pkg_install(sprintf("renv@%s", Sys.getenv("RENV_LOCK_VERSION")))
          RSCRIPT

      - name: Update renv.lock
        id: update
        if: steps.lockfile.outputs.has_lockfile == 'true'
        run: |
          RENV_LOCK_BASE="$RUNNER_TEMP/renv.lock.base"
          git show HEAD:renv.lock > "$RENV_LOCK_BASE"
          export RENV_LOCK_BASE
          Rscript - <<'RSCRIPT'
          # Keep the repository URL the lockfile records pointing at CRAN
          # rather than the moving "latest" Posit Package Manager snapshot the
          # runner is configured with. Both lines are needed: use-public-rspm
          # sets RENV_CONFIG_REPOS_OVERRIDE, which renv honours ahead of
          # options(repos), so pinning options alone leaves the PPM URL in the
          # lockfile (measured in uribo/renv-update-smoke, 2026-09-05).
          Sys.unsetenv("RENV_CONFIG_REPOS_OVERRIDE")
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          renv::restore(prompt = FALSE)
          # Update through renv's own installer, not pak. With pak enabled,
          # renv::update() hands every installed package to one
          # pak::pkg_install(upgrade = TRUE) call, so a single package that
          # has left CRAN fails the whole solve and every package reports
          # "dependency conflict" (polite 0.1.4 left the index in 2026-09 and
          # broke a generated project's weekly update for five weeks); renv
          # 1.2.4 also drops `exclude` on that path. renv's installer skips
          # packages missing from the repository instead. The consequence is
          # that future archivals pass silently: an archived package stays at
          # its recorded version. See issue #17.
          #
          # Point the installer at P3M for the update only. renv rewrites its
          # default P3M URL (config ppm.url) to the Linux binary endpoint for
          # this distribution, so the updates install as binaries instead of
          # compiling from source within the job timeout; other hosts such as
          # p3m.dev are rewritten only after a status API round trip. restore
          # above keeps its current setup.
          options(
            renv.config.pak.enabled = FALSE,
            repos = c(CRAN = "https://packagemanager.posit.co/cran/latest")
          )
          # Leave renv itself alone. A PR that bumps renv cannot be taken in
          # with restore(), which skips renv, so collaborators stay on the
          # old version with status() out of sync and activate.R rewritten.
          # Upgrade renv deliberately with renv::upgrade(). See issue #17.
          renv::update(prompt = FALSE, exclude = "renv")
          # The lockfile records options(repos) at snapshot time, so switch
          # back to CRAN before writing it. snapshot also reflects the
          # downstream project's configured snapshot.type, so PR reviewers
          # should check removals as well as version bumps.
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          renv::snapshot(prompt = FALSE)
          # Put back the committed record of every package whose version did
          # not change. restore installs every package as a P3M Linux binary,
          # whose DESCRIPTION carries P3M source fields, and snapshot reads
          # those, so without this every unchanged record has its Repository
          # rewritten to the P3M URL (137 of 152 and 147 of 167 records in two
          # generated projects, 2026-09 and 2026-10). Records of updated
          # packages keep what the installer stamped. Only repository records
          # qualify: renv::update() also moves Git remotes to a new RemoteSha
          # at an unchanged Version, and restoring those would pin the old
          # commit while the library holds the new one. Pre-1.0 lockfiles
          # name the repository source "CRAN", "RSPM", "P3M" or "PPM", which
          # renv treats as "Repository". Drop pak, which this job installs as
          # tooling, unless the project already records it. See issue #17.
          base <- renv::lockfile_read(Sys.getenv("RENV_LOCK_BASE"))
          lock <- renv::lockfile_read("renv.lock")
          is_repository <- function(record) {
            source <- record$Source
            !is.null(source) &&
              tolower(source) %in% c("repository", "cran", "rspm", "p3m", "ppm")
          }
          same <- intersect(names(lock$Packages), names(base$Packages))
          same <- same[vapply(
            same,
            function(p) {
              old <- base$Packages[[p]]
              new <- lock$Packages[[p]]
              is_repository(old) &&
                is_repository(new) &&
                identical(new$Version, old$Version)
            },
            logical(1)
          )]
          lock$Packages[same] <- base$Packages[same]
          if (!"pak" %in% names(base$Packages)) lock$Packages$pak <- NULL
          renv::lockfile_write(lock, "renv.lock")
          RSCRIPT

          if git diff --quiet -- renv.lock renv/activate.R; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # tar_quarto() shells out to `quarto inspect` while the pipeline is being
      # constructed, so tar_validate() needs the CLI even though this job never
      # renders a note. Without it those targets leave the DAG, and the
      # validation covers less than the project contains -- _targets.R prints
      # what it excluded, but this job runs unattended, so nobody reads it.
      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.update.outputs.has_changes == 'true' && hashFiles('_targets.R') != ''

      - name: Validate targets pipeline
        if: steps.update.outputs.has_changes == 'true' && hashFiles('_targets.R') != ''
        run: Rscript -e 'targets::tar_validate()'

      - name: Run tests
        if: steps.update.outputs.has_changes == 'true' && hashFiles('tests/testthat.R') != ''
        run: Rscript tests/testthat.R

      - name: Summarize package changes
        if: steps.update.outputs.has_changes == 'true'
        run: |
          # Show the commit of Git-sourced records too: renv::update() moves
          # them to a new RemoteSha without a version bump.
          records='.Packages | to_entries[] | "\(.key) \(.value.Version)\(if .value.RemoteSha then " @ " + .value.RemoteSha[0:7] else "" end)"'
          old=$(git show HEAD:renv.lock 2>/dev/null | jq -r "$records" | sort)
          new=$(jq -r "$records" renv.lock | sort)
          # Test the diff for emptiness explicitly: without pipefail the
          # pipeline returns sed's status, so an `|| echo` fallback never runs.
          changes=$(diff <(printf '%s\n' "$old") <(printf '%s\n' "$new") \
            | grep '^[<>]' \
            | sed 's/^< /- /; s/^> /+ /' || true)
          {
            echo "Automated renv package update."
            echo
            echo "Package-level changes:"
            if [ -n "$changes" ]; then
              printf '%s\n' "$changes"
            else
              echo "(metadata-only lockfile change)"
            fi
            echo
            echo "Note: renv::snapshot() uses this project's snapshot.type."
            echo "Review package removals as well as version updates."
            echo
            echo "After merging, re-run tar_make() locally to rebuild the store under the updated lockfile: targets does not invalidate cached objects on package updates unless a version-pin target covers them, so tar_outdated() may report nothing. With gittargets, snapshot the store on the pre-merge commit first (see docs/gittargets.md)."
            echo
            echo "Validation run:"
            if [ -f _targets.R ]; then
              echo "- targets::tar_validate()"
            else
              echo "- targets::tar_validate() skipped: _targets.R not found"
            fi
            if [ -f tests/testthat.R ]; then
              echo "- Rscript tests/testthat.R"
            else
              echo "- Rscript tests/testthat.R skipped: tests/testthat.R not found"
            fi
            echo
            echo "Changed files:"
            git diff --name-only -- renv.lock renv/activate.R
          } > renv-update-pr-body.md

      - name: Open or update pull request
        if: steps.update.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/renv-update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$UPDATE_BRANCH":"refs/remotes/origin/$UPDATE_BRANCH" || true
          git checkout -B "$UPDATE_BRANCH"
          git add renv.lock
          if [ -f renv/activate.R ]; then
            git add renv/activate.R
          fi
          git commit -m "chore(renv): update R package lockfile"

          if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH"; then
            lease=$(git rev-parse "refs/remotes/origin/$UPDATE_BRANCH")
            git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$lease" origin "$UPDATE_BRANCH"
          else
            git push origin "$UPDATE_BRANCH"
          fi

          pr_number=$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(renv): update R package lockfile" \
              --body-file renv-update-pr-body.md
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore(renv): update R package lockfile" \
              --body-file renv-update-pr-body.md
          fi
