# jarl: R linter (https://jarl.etiennebacher.com/)
#
# Formatting stays with air (air.toml). jarl ships no format rules by design --
# it defers brace, line-length and paren rules to air -- so the two tools do
# not overlap and neither replaces the other.
#
# Keep this in step with the version CI installs
# (.github/workflows/R-check.yaml) and with the binary on PATH, so the editor
# and CI report the same rule set. jarl is pre-1.0 and adds rules in every
# release, which is what makes an unpinned trio drift apart.

[lint]
# outer_negation: `any(!is.finite(x))` is the house idiom for validation
# guards. It states the intent at the call site -- "any bad value is present"
# -- readability takes priority over avoiding element-wise negation here.
#
# Keep unreachable_code enabled to catch unintended dead code. For deliberate
# renv dependency declarations, put this comment directly above `if (FALSE)`:
#   # jarl-ignore unreachable_code: Declare an optional dependency for renv.
# This suppresses only the declaration; the rule has no automatic fix.
ignore = ["outer_negation"]

[lint.missing_argument]
# case_when() and tribble() accept trailing commas the way mutate() does, but
# they are absent from jarl's default skip list, so a trailing comma there is
# reported as a forgotten argument.
# This skips all missing arguments in these calls, including accidental empty
# arguments between commas, not just trailing commas. Namespaced calls match too.
extend-skipped-functions = ["case_when", "tribble"]
